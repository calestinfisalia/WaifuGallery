[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waifu-gallery"
version = "0.1.15"
description = "A Linux desktop image and video gallery for public booru APIs"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7", "requests>=2.32,<3", "cryptography>=44,<47"]

[tool.setuptools.packages.find]
where = ["."]
