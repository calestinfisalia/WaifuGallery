[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waifu-gallery"
version = "0.1.11"
description = "A Linux desktop image and video gallery for public booru APIs"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7", "requests>=2.32,<3"]

[tool.setuptools.packages.find]
where = ["."]
